   <style>
        /* ОСНОВНЫЕ СТИЛИ ЭКРАНА */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Arial', sans-serif;
            color: #5e4d58;
            overflow: hidden;
            overscroll-behavior: none;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        /* ОТДЕЛЬНЫЙ СЛОЙ ДЛЯ РАЗМЫТОГО ФОНА */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #fdf5e6;
            background-image: url('back.png');
            background-size: cover;
            background-position: center;
            filter: blur(8px);
            transform: scale(1.1); 
            z-index: -2;
        }

        /* Общий контейнер*/
        .wrapper {
            position: relative;
            z-index: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding: 20px;
        }

        /* Общие стили окон */
        .window {
            display: none; 
            border-radius: 20px;
            box-shadow: 0 10px 25px #c58e8e;
            /*overflow: hidden;*/
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
            max-width: 100%;
        }

        .bean-bottom-right {
            position: absolute;
            bottom: -230px; 
            right: -40px;  
            width: 300px;   
            z-index: 10;   
            transform: rotate(5deg); 
            pointer-events: none; 
        }

        /* === 1. ЭКРАН НАЧАЛА: Стиль заметки Notes === */
        #start-window {
            display: flex; 
            width: 90%; 
            max-width: 380px;
            height: auto;
            background: #fffdfb; 
            flex-direction: column;
            align-items: center;
            border: 2px solid #fffdfb; 
            padding-bottom: 40px;
        }
        
        .notes-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #EA7EA3; 
            font-weight: bold;
            font-size: 14px;
    
            /* Новые свойства для линии */
            padding-bottom: 15px; /* Отступ от текста шапки до самой линии */
            margin-bottom: 25px; /* Отступ от линии вниз, до заголовка */
            border-bottom: 1px solid #EA7EA3; /* тонкая линия */
        }

        #start-title {
            font-size: 30px;
            color: #EA7EA3;
            margin-bottom: 10px;
            font-family: 'Montserrat', serif;
            font-weight: bold;
        }

        #start-subtitle {
            font-size: 16px;
            font-style: italic;
            color: #5e4d58;
            margin-bottom: 30px;
        }

        /* === 2. ЭКРАН ВОПРОСОВ === */
        #question-window {
            width: 90%; 
            min-height: 350px;
            max-height: 85vh; 
            overflow-y: auto; /* Включает вертикальную прокрутку для кнопок */
            background: #fffdfb;
            border-radius: 20px;
            display: none; 
            flex-direction: column;
            border: 2px solid #fffdfb;
            padding-bottom: 20px;
        }

        .question-text {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
            margin-top: 15px;
        }

        #answer-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* === 3. ЭКРАН РЕЗУЛЬТАТА: Стиль Instagram === */
        #result-window {
            width: 90%; 
            max-width: 400px;
            min-height: auto;
            height: auto; 
            background: #ffffff; 
            border-radius: 10px;
            display: none; 
            flex-direction: column;
            border: 1px solid #ffffff; 
            position: relative;
            max-height: 85vh; 
            overflow-y: auto
        }
        
        .instagram-post {
            width: 90%; 
            max-width: 400px;
            height: 75vh; /* Жестко ограничиваем высоту окна по экрану телефона */
            background: #ffffff; 
            border-radius: 10px;
            display: none; 
            flex-direction: column;
            border: 1px solid #ffffff; 
            position: relative;
            box-sizing: border-box;
        }

        #result-pairing-name {
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 5px;
            margin-top: 0;
            color: #EA7EA3; 
            font-family: 'Montserrat', serif;
        }

        #result-description {
            font-size: 13px;
            line-height: 1.4;
            color: #5c4d4d;
            margin-bottom: 10px;
            text-align: center;
        }

        .insta-footer {
            width: 100%;
            position: absolute;
            bottom: 15px;
            left: 0;
            padding: 0 15px;
            display: flex;
            justify-content: space-between;
            color: #EA7EA3;
            font-size: 18px;
            box-sizing: border-box;
        }

        /* СТИЛИ КНОПОК */
        .btn {
            background-color: transparent;
            border: 2px solid #EA7EA3; 
            color: #EA7EA3;
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            font-family: 'Montserrat', serif;
        }

        .btn:hover {
            background-color: #EA7EA3;
            color: white;
        }
        
        .bean-decorative {
            position: absolute;
            width: 30px;
            height: auto;
            opacity: 0.8;
            z-index: 5;
        }
        #tg-credit {
    position: fixed;
    bottom: 15px; /* Отступ от самого низа экрана */
    left: 0;
    width: 100%;
    text-align: center;
    font-size: 13px;
    color: #ffffff; 
    text-decoration: none; 
    font-family: 'Montserrat', sans-serif;
    opacity: 0.8; 
    z-index: 9999; 
    letter-spacing: 0.5px;
}

#tg-credit:active {
    opacity: 1; /* При нажатии надпись становится ярче */
}
    </style>
</head>

        {

        {
            question: "В шоколадных жабах новая коллекция карточек - «Волшебные предметы». Какая карточка попалась тебе?",

                { text: "Зачарованный галеон", pairings: ["Гармония", "Ромиона"] },
                { text: "Маховик времени", pairings: ["Томиона", "Теомиона"] },
                { text: "Один из артефактов основателей Хогвартса", pairings: ["Пэнвилл"] },

        },
        {
            question: "Какой секрет скрыт на самом дне коробки «Берти Боттс»?",
            answers: [
                { text: "Мы оба знаем, кто на самом деле совершил то самое преступление, но унесем эту тайну в могилу", pairings: ["Томиона", "Томайна", "Теомиона"] },
                { text: "Мои личные дневники исписаны его именем, хотя на публике я делаю вид, что его для меня не существует", pairings: ["Гармония", "Хинни", "Снейджер"] },

        function startQuiz() {
            scores = { "Драмиона": 0, "Гармония": 0, "Ромионa": 0, "Хэнси": 0, "Теомионa": 0, "Хинни": 0, "Фремиона": 0, "Томиона": 0, "Дринни": 0, "Снейджер": 0, "Пэнвилл": 0, "Томайна": 0 };
            currentQuestionIndex = 0;
            startWindow.style.display = "none";
            questionWindow.style.display = "flex";
            showQuestion();
        }

        function showQuestion() {
            answerButtonsElement.innerHTML = "";
            let currentQuestion = questions[currentQuestionIndex];
            questionElement.innerText = currentQuestion.question;
            
            currentQuestion.answers.forEach(answer => {
                const button = document.createElement("button");
                button.innerText = answer.text;
                button.classList.add("btn");
                button.onclick = () => selectAnswer(answer.pairings);
                answerButtonsElement.appendChild(button);
            });
        }

        function selectAnswer(pairings) {
            pairings.forEach(pairing => {
                if(scores[pairing] !== undefined) scores[pairing]++;
            });
            currentQuestionIndex++;
            if (currentQuestionIndex < questions.length) {
                showQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            questionWindow.style.display = "none";
            resultWindow.style.display = "flex";
            
            let maxScore = 0;
            let finalPairing = "Драмиона"; 

            for (const [pairing, score] of Object.entries(scores)) {
                if (score > maxScore) {
                    maxScore = score;
                    finalPairing = pairing;
                }
            }
            
            resultPairingNameElement.innerText = finalPairing.toUpperCase();
            resultDescriptionElement.innerText = results[finalPairing] || "Описание пейринга скоро появится...";
        }

        function restartQuiz() {
            resultWindow.style.display = "none";
            startWindow.style.display = "flex";
